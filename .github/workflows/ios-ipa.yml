name: iOS iPad IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  NODE_VERSION: 22.x

jobs:
  build-ios-ipa:
    name: Build iPad IPA
    runs-on: macos-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install

      - name: Copy .env file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build web assets
        run: pnpm build

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Prepare iOS wrapper project
        run: |
          mkdir -p ios-ci/Sources ios-ci/Resources/www
          cp -R dist/renderer/. ios-ci/Resources/www/

          cat > ios-ci/project.yml <<'YAML'
          name: SPlayeriOS
          options:
            minimumXcodeGenVersion: 2.37.0
          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: top.imsyy.splayer.ios
              MARKETING_VERSION: 1.0.0
              CURRENT_PROJECT_VERSION: 1
              TARGETED_DEVICE_FAMILY: 2
              INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
                - UIInterfaceOrientationPortrait
                - UIInterfaceOrientationPortraitUpsideDown
                - UIInterfaceOrientationLandscapeLeft
                - UIInterfaceOrientationLandscapeRight
              INFOPLIST_KEY_UIRequiresFullScreen: NO
          targets:
            SPlayeriOS:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: Sources
                - path: Resources
                  buildPhase: resources
              settings:
                base:
                  PRODUCT_NAME: SPlayer
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: SPlayer
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
          YAML

          cat > ios-ci/Sources/AppDelegate.swift <<'SWIFT'
          import UIKit

          @main
          final class AppDelegate: UIResponder, UIApplicationDelegate {
            func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil
            ) -> Bool {
              return true
            }

            func application(
              _ application: UIApplication,
              configurationForConnecting connectingSceneSession: UISceneSession,
              options: UIScene.ConnectionOptions
            ) -> UISceneConfiguration {
              let configuration = UISceneConfiguration(name: "Default Configuration", sessionRole: connectingSceneSession.role)
              configuration.delegateClass = SceneDelegate.self
              return configuration
            }
          }
          SWIFT

          cat > ios-ci/Sources/SceneDelegate.swift <<'SWIFT'
          import UIKit

          final class SceneDelegate: UIResponder, UIWindowSceneDelegate {
            var window: UIWindow?

            func scene(
              _ scene: UIScene,
              willConnectTo session: UISceneSession,
              options connectionOptions: UIScene.ConnectionOptions
            ) {
              guard let windowScene = scene as? UIWindowScene else { return }
              let window = UIWindow(windowScene: windowScene)
              window.rootViewController = ViewController()
              window.makeKeyAndVisible()
              self.window = window
            }
          }
          SWIFT

          cat > ios-ci/Sources/ViewController.swift <<'SWIFT'
          import UIKit
          import WebKit

          final class ViewController: UIViewController {
            private var webView: WKWebView!

            override func viewDidLoad() {
              super.viewDidLoad()
              let configuration = WKWebViewConfiguration()
              configuration.allowsInlineMediaPlayback = true
              webView = WKWebView(frame: .zero, configuration: configuration)
              webView.translatesAutoresizingMaskIntoConstraints = false
              view.addSubview(webView)

              NSLayoutConstraint.activate([
                webView.topAnchor.constraint(equalTo: view.topAnchor),
                webView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                webView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                webView.bottomAnchor.constraint(equalTo: view.bottomAnchor)
              ])

              if let indexUrl = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "www") {
                let accessUrl = indexUrl.deletingLastPathComponent()
                webView.loadFileURL(indexUrl, allowingReadAccessTo: accessUrl)
              }
            }
          }
          SWIFT

          cd ios-ci
          xcodegen generate

      - name: Build unsigned iPad app archive
        run: |
          xcodebuild \
            -project ios-ci/SPlayeriOS.xcodeproj \
            -scheme SPlayeriOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SPlayer-iPad.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/SPlayer-iPad.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r SPlayer-iPad-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-iPad-ipa
          path: build/SPlayer-iPad-unsigned.ipa
